[build]
  publish = "/"
  command = ""

[dev]
  framework = "#static"
  autoLaunch = false

# O service worker não pode ser cacheado agressivamente, senão atualizações
# do app demoram a chegar.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
